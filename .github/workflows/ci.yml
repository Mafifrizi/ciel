name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Verify Ciel Stack
    runs-on: ubuntu-latest
    env:
      TANUKI_MODE: rust
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: teamserver/go.sum

      - name: Set up Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Build, Qt6, and PostgreSQL Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            qt6-base-dev \
            libssl-dev \
            postgresql \
            postgresql-client \
            python3 \
            python3-pil \
            fonts-dejavu-core
          PG_BIN_DIR="$(dirname "$(ls /usr/lib/postgresql/*/bin/postgres | sort -V | tail -n1)")"
          echo "$PG_BIN_DIR" >> "$GITHUB_PATH"

      - name: Build Tempest, Shuna, Teamserver, and Qt6 Client
        run: make all

      - name: Run Go Vet & Full Verification Suite
        run: |
          cd teamserver && go vet ./...
          cd ..
          make test

      - name: Verify Docker Compose Config
        run: POSTGRES_PASSWORD=ci-check docker compose -f deploy/docker-compose.yml config -q
